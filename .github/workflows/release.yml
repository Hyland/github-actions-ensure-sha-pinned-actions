name: Release

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    uses: Alfresco/alfresco-build-tools/.github/workflows/reusable-release.yml@1e3c532db0dac7229f51e6296ac5414260ed2357 # v19.0.0
    with:
      release_type_override: ${{ inputs.release_type }}
    secrets:
      BOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
